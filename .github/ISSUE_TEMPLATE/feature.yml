name: 機能・改善の依頼
description: 新しい機能や既存の動作・デザインの変更を依頼する
title: "【依頼】"
labels: ["enhancement", "依頼"]
body:
  - type: markdown
    attributes:
      value: |
        パスワード・アクセスキー・メールアドレス・問い合わせ内容・DBの中身など、秘密や個人情報は書かないでください。
        仕様書と異なる変更は、理由や制約も書いてください。
  - type: textarea
    id: summary
    attributes:
      label: 依頼の概要
      description: 変更したいことを簡潔に書いてください。
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景・困っていること
      description: なぜ必要ですか。いま何が起きているかを書いてください。
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果・完了の条件
      description: どうなれば完了ですか。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 決めてほしいこと・制約
      description: 費用、見た目、仕様などの希望があれば書いてください。
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連する画面・Phase・Issue
      description: 分からなければ空欄で構いません。
    validations:
      required: false
