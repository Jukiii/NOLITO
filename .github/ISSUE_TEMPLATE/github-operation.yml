name: GitHub操作の依頼
description: GitHub上のIssue・PR・ラベルなどの操作をCopilotに依頼する
title: "【依頼】"
labels: ["依頼", "GitHub操作"]
body:
  - type: markdown
    attributes:
      value: |
        このIssueはCopilotが対応します。GitHubの操作内容を具体的に書いてください。
        パスワード・アクセスキー・メールアドレスなどの秘密や個人情報は書かないでください。
        削除・公開範囲・権限・課金に関わる操作は、必要に応じて確認してから実行します。
  - type: dropdown
    id: operation
    attributes:
      label: 操作の種類
      options:
        - Issue
        - Pull Request
        - ラベル
        - マイルストーン
        - ブランチ
        - リポジトリ設定・アクセス権限
        - GitHub Actions
        - Projects
        - その他
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 対象
      description: リポジトリ内のIssue/PR番号、URL、ラベル名などを記入してください。
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 依頼する操作
      description: 何をどう変更するか、具体的に書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 完了条件
      description: 操作後にどうなっていれば完了ですか。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足・制約
      description: 期限や、実行前に確認してほしいことがあれば記入してください。
    validations:
      required: false
