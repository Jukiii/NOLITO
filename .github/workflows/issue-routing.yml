name: Issue routing

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(({ name }) => name);
            const isRepositoryOwner = issue.author_association === "OWNER";

            if (labels.includes("question") && isRepositoryOwner) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: [
                  "@Jukiii",
                  "",
                  "質問として受け付けました。このリポジトリは公開設定のため、Copilot Automationsによる自動回答は利用できません。この通知は回答ではありません。回答はブランチを作らず、このIssueに日本語でコメントしてください。"
                ].join("\n")
              });
              return;
            }
            const isTask = labels.includes("bug") || labels.includes("enhancement");

            if (isTask && isRepositoryOwner) {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: issue.number,
                assignees: ["copilot"]
              });
            }
