<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- テーマ・文字サイズ・アニメーションの、ちらつき防止(FOUC)。CSSが読み込まれる前に、保存済みの選択を反映する -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nolito:theme:v1");
          if (/^(light|white|dark|pretty)$/.test(t)) document.documentElement.dataset.theme = t;
          var f = localStorage.getItem("nolito:font-size:v1");
          if (f === "large" || f === "xlarge") document.documentElement.dataset.fontSize = f;
          var m = localStorage.getItem("nolito:motion:v1");
          if (m === "reduce") document.documentElement.dataset.reducedMotion = m;
        } catch (e) {}
      })();
    </script>
    <title>用語一覧 | 上司から逃げろ | NOLITO</title>
    <meta
      name="description"
      content="「上司から逃げろ」に出てくる用語を、職種ごとに一覧で確認できます。読み・説明・関連する語つき。キーワードと職種で絞り込めます。"
    />
    <link rel="canonical" href="https://nolito.pages.dev/games/escape-boss/glossary/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/game.css" />
    <link rel="stylesheet" href="/assets/css/glossary.css" />
    <script type="module" src="/assets/js/main.js"></script>
    <script type="module" src="/assets/js/games/escape-boss/glossary-page.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へスキップ</a>
    <header class="site-header" data-site-header>
      <noscript>
        <div class="site-header__inner container">
          <a class="site-logo" href="/">NOLITO</a>
        </div>
      </noscript>
    </header>
    <main class="main container" id="main" tabindex="-1">
      <p class="breadcrumb"><a href="/games/escape-boss/">← 上司から逃げろ</a></p>
      <div class="glossary" data-glossary>
        <h1>用語一覧</h1>
        <p class="glossary__lead">
          「上司から逃げろ」に出てくる用語を、職種ごとに確認できます。覚えたら、
          <a href="/games/escape-boss/">ゲームの「用語確認」や「連続タイピング」</a
          >で練習しましょう。
        </p>

        <noscript>
          <p class="glossary__notice">用語一覧を表示するには、JavaScript を有効にしてください。</p>
        </noscript>

        <form class="glossary__form" data-glossary-form role="search" aria-label="用語の絞り込み">
          <div class="glossary__field">
            <label for="glossary-input">キーワード(語・読み・説明など)</label>
            <input
              class="glossary__input"
              id="glossary-input"
              type="search"
              autocomplete="off"
              data-glossary-input
            />
          </div>
          <div class="glossary__field">
            <label for="glossary-job">職種</label>
            <select class="glossary__select" id="glossary-job" data-glossary-job></select>
          </div>
          <div>
            <button class="button button--primary" type="submit">絞り込む</button>
          </div>
        </form>

        <p class="glossary__status" role="status" aria-live="polite" data-glossary-status></p>
        <nav class="glossary__jump" aria-label="職種へジャンプ" data-glossary-jump hidden></nav>
        <div data-glossary-list></div>
      </div>
    </main>
    <footer class="site-footer" data-site-footer>
      <noscript>
        <div class="container"><small>© NOLITO</small></div>
      </noscript>
    </footer>
  </body>
</html>
