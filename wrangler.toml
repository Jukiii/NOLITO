# ローカルでの開発・確認だけに使う設定(wrangler pages dev / wrangler d1 ...)。
#
# 注意: このファイルに `pages_build_output_dir` を書かない。
#   書くと、Cloudflare Pages が、このファイルを「設定の正」とみなして、ダッシュボードで設定した
#   バインディング・環境変数が、読み取り専用になる(本番の設定が、上書きされる)。
#   書かなければ、このファイルは、ローカルの開発にだけ使われ、ダッシュボードの設定が、有効なまま。
# 本番・プレビューの D1・環境変数・シークレットは、Cloudflare のダッシュボードで設定する(docs/auth-setup.md)。

name = "nolito"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "nolito"
# ローカルの確認用の仮の ID(秘密ではない)。本番の D1 の ID は、ダッシュボードで結びつけるので、ここには書かない
database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "migrations"
