<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>検索 | NOLITO</title>
    <meta
      name="description"
      content="NOLITOのプロダクト・記事・「上司から逃げろ」の用語を、まとめて検索します。カテゴリ・タグ・職種で絞り込めます。"
    />
    <link rel="canonical" href="https://nolito.pages.dev/search/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/search.css" />
    <script type="module" src="/assets/js/main.js"></script>
    <script type="module" src="/assets/js/search/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へスキップ</a>
    <header class="site-header" data-site-header>
      <noscript>
        <div class="site-header__inner container">
          <a class="site-logo" href="/">NOLITO</a>
        </div>
      </noscript>
    </header>
    <main class="main container" id="main" tabindex="-1">
      <div class="search" data-search>
        <h1>検索</h1>
        <p class="search__lead">
          プロダクト・記事・「上司から逃げろ」の用語を、まとめて検索します。
        </p>

        <noscript>
          <p class="search__notice">検索には、JavaScript が必要です。</p>
        </noscript>

        <form class="search__form" data-search-form role="search">
          <div class="search__field">
            <label for="search-input">キーワード</label>
            <input
              class="search__input"
              id="search-input"
              type="search"
              autocomplete="off"
              data-search-input
            />
          </div>
          <div class="search__filters">
            <div class="search__field">
              <label for="search-category">カテゴリ</label>
              <select class="search__select" id="search-category" data-search-category></select>
            </div>
            <div class="search__field">
              <label for="search-tag">タグ</label>
              <select class="search__select" id="search-tag" data-search-tag></select>
            </div>
            <div class="search__field">
              <label for="search-job">職種(上司から逃げろの用語)</label>
              <select class="search__select" id="search-job" data-search-job></select>
            </div>
          </div>
          <div>
            <button class="button button--primary" type="submit">検索する</button>
          </div>
        </form>

        <p class="search__status" role="status" data-search-status aria-live="polite"></p>
        <ul class="search__results" data-search-results></ul>
      </div>
    </main>
    <footer class="site-footer" data-site-footer>
      <noscript>
        <div class="container"><small>© NOLITO</small></div>
      </noscript>
    </footer>
  </body>
</html>
