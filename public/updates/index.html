<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- テーマ・文字サイズ・アニメーションの、ちらつき防止(FOUC)。CSSが読み込まれる前に、保存済みの選択を反映する -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nolito:theme:v1");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
          var f = localStorage.getItem("nolito:font-size:v1");
          if (f === "large" || f === "xlarge") document.documentElement.dataset.fontSize = f;
          var m = localStorage.getItem("nolito:motion:v1");
          if (m === "reduce") document.documentElement.dataset.reducedMotion = m;
        } catch (e) {}
      })();
    </script>
    <title>更新履歴 | NOLITO</title>
    <meta
      name="description"
      content="NOLITOのプロダクトの更新と、記事の公開・更新の履歴です。新しい順に並べています。"
    />
    <link rel="canonical" href="https://nolito.pages.dev/updates/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="更新履歴 | NOLITO" />
    <meta
      property="og:description"
      content="NOLITOのプロダクトの更新と、記事の公開・更新の履歴です。新しい順に並べています。"
    />
    <meta property="og:url" content="https://nolito.pages.dev/updates/" />
    <meta property="og:site_name" content="NOLITO" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/updates.css" />
    <script type="module" src="/assets/js/main.js"></script>
    <script type="module" src="/assets/js/updates/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へスキップ</a>
    <header class="site-header" data-site-header>
      <noscript>
        <div class="site-header__inner container">
          <a class="site-logo" href="/">NOLITO</a>
        </div>
      </noscript>
    </header>
    <main class="main container" id="main" tabindex="-1">
      <div class="updates">

          プロダクトの更新と、記事の公開・更新を、新しい順に並べています。プロダクトごとの詳しい履歴は、各プロダクトの詳細ページにあります。
        </p>
        <div data-updates-list>
          <noscript><p>更新履歴の表示には、JavaScript が必要です。</p></noscript>
        </div>
        <aside class="ad-slot" data-ad-slot="page" aria-label="広告" hidden></aside>
      </div>
    </main>
    <footer class="site-footer" data-site-footer>
      <noscript>
        <div class="container"><small>© NOLITO</small></div>
      </noscript>
    </footer>
  </body>
</html>
