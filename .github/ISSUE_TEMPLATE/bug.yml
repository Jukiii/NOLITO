name: バグ報告
description: 動作がおかしい・期待どおりに動かない問題を報告する
title: "【バグ】"
labels: ["bug", "依頼"]
body:
  - type: markdown
    attributes:
      value: |
        パスワード・アクセスキー・メールアドレス・問い合わせ内容・DBの中身など、秘密や個人情報は書かないでください。
  - type: textarea
    id: summary
    attributes:
      label: 問題の概要
      description: 何が起きていますか。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題を再現するための操作を書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 関連する画面・環境
      description: ページ、ブラウザー、端末など。分からなければ空欄で構いません。
    validations:
      required: false
